[tool.poetry]
name = "cpassgen"
version = "0.1.0"
description = "CLI утилита управления паролями"
authors = ["prohodimka.pro <you@example.com>"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
click = "^8.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0"
pytest-cov = "^4.0"
black = "^26.5"
isort = "^8.0"
flake8 = "^7.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 79
